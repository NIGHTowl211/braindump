function toggleTask(k,id){const it=(state.buckets[k]||[]).find(i=>i.id===id); if(!it) return;
  it.done=!it.done; it.doneAt=it.done?Date.now():null;
  if(it.done){it.decided=true; justDone=id; setTimeout(()=>{justDone=null},700)}
  else (state.routine||[]).forEach(sl=>{if(sl.taskId===id) sl.sdone=false});
  markRep(it); render(); save();}
function focusTask(id){ensureRoutine(); const r=state.routine=state.routine||[]; const t=findItem(id)[1]; if(!t) return null;
  const i=r.findIndex(x=>x.taskId===id&&!slotDone(x)); let sl;
  if(i>=0){sl=r.splice(i,1)[0]} else sl={id:uid(),task:t.text,mins:defMins(),brk:false,taskId:id};
  const fu=r.findIndex(x=>!slotDone(x)); r.splice(fu<0?r.length:fu,0,sl); save(); return sl.id;}
async function stuckAI(h){const key=h.id, fb="Set a 2-minute timer and just open it. That's all.";
  if(!sampleFn){stuck[key]={step:fb}; renderHome(); return}
  stuck[key]={busy:true}; renderHome();
  try{const r=await sampleFn.json(`The user has ADHD and is stuck starting this task: "${h.text.replace(/"/g,"'")}". Give ONE tiny, concrete, physical first step they can do in under 2 minutes. Max 14 words, start with a verb, no advice or pep talk. Return ONLY JSON: {"step":str}`,{modelTier:"quick"});
    stuck[key]={step:String(r.step||fb)}}
  catch(e){stuck[key]={step:fb}}
  renderHome();}
const CHECKSVG='<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>';
function renderHome(){if(!homeEl||homeEl.hidden) return; const b=state.buckets||{}, p=state.profile||{};
  const must=["urgent","todo"].flatMap(k=>(b[k]||[]).filter(i=>!(i.carried&&!i.decided)).map(i=>({...i,k})));
  const openM=must.filter(i=>!i.done), doneM=must.filter(i=>i.done);
  const hero=homeHero(), st=hero&&stuck[hero.id];
  const rest=openM.filter(i=>!(hero&&hero.taskId===i.id)), vis=rest.slice(0,5), more=rest.length-vis.length;
  const happy=b.happy||[], lo=BUCKETS.flatMap(x=>(b[x.k]||[]).filter(i=>i.carried&&!i.decided).map(i=>({...i,k:x.k})));
  const cnt=k=>(b[k]||[]).filter(i=>!i.done).length;
  const hasAny=BUCKETS.some(x=>(b[x.k]||[]).length);
  const row=i=>`<div class="row${i.done?" done":""}" style="--c:var(--${i.k})"><button class="cb" data-hdone="${i.k}:${i.id}" aria-label="${i.done?"Mark not done":"Mark done"}">${CHECKSVG}</button>
    <span class="txt">${esc(i.text)}${i.k==="urgent"&&!i.done?'<span class="utag">urgent</span>':""}${i.repId?'<span class="carry">🔁</span>':""}</span>
    ${i.done?"":`<button class="hgo" data-hfocus="${i.id}" title="Do this now" aria-label="Do this now">▶</button>`}</div>`;
  let heroHTML;
  if(hero) heroHTML=`<section class="hero2" style="--c:${hero.brk?"var(--happy)":hero.k?`var(--${hero.k})`:"var(--todo)"}">
      <span class="hlbl">${hero.brk?"Time for a break":"Do this now"}</span>
      <h2 class="htask">${esc(hero.text)}</h2>
      <p class="hmeta">${hero.mins} min${hero.k&&!hero.brk?" · "+LABEL(hero.k):""}</p>
      ${st&&st.step?`<div class="tiny"><b>Tiny first step</b><span>${esc(st.step)}</span><button class="bigplay" data-hstep>▶ Start 2 min</button></div>`:""}
      <div class="hacts"><button class="bigplay xl" data-hstart>▶ Start</button><button class="ghost lg" data-hdonehero>✓ Done</button>
        ${hero.brk?"":`<button class="ghost lg" data-hstuck ${st&&st.busy?"disabled":""}>${st&&st.busy?"Thinking…":"🧩 I'm stuck"}</button>`}
        <button class="ghost lg" data-hlater>Not now</button></div></section>`;
  else if(hasAny&&doneM.length) heroHTML=`<section class="hero2" style="--c:var(--happy)"><span class="hlbl">All done</span><h2 class="htask">You finished everything for today 🎉</h2>
      <p class="hmeta">Rest counts too. Or dump anything new that came up.</p><div class="hacts"><a class="bigplay xl" href="#wins">See today's wins</a><button class="ghost lg" data-hdump>Brain dump</button></div></section>`;
  else heroHTML=`<section class="hero2" style="--c:var(--todo)"><span class="hlbl">Start here</span><h2 class="htask">What's in your head right now?</h2>
      <p class="hmeta">Say or type everything, messy is fine. You'll get one clear thing to do.</p>
      <div class="hacts"><button class="bigplay xl" data-hdump>Start a brain dump</button><button class="ghost lg" data-hphoto>📷 Photo of a list</button></div></section>`;
  homeEl.innerHTML=`<div class="hello"><div><h1>${greet()}${p.name?", "+esc(p.name):""}</h1>${state.note?`<p>${esc(state.note)}</p>`:""}</div><span class="grow"></span>
      <button class="ghost sm" data-hdump><svg viewBox="0 0 24 24" width="16" height="16" style="stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>Brain dump</button></div>
    ${lo.length?`<div class="lobanner"><span>↻ ${lo.length} thing${lo.length>1?"s":""} from yesterday</span><button class="ghost sm" data-hlo style="margin-left:auto">${homeLO?"Hide":"Decide"}</button>
      ${homeLO?`<div class="lorows">${lo.map(i=>`<div class="lorow"><span class="txt">${esc(i.text)}</span><span class="loacts"><button data-lo="keep" data-id="${i.id}">Do today</button><button data-lo="tmr" data-id="${i.id}">Tomorrow</button><label class="lodate">Pick day<input type="date" data-lo="date" data-id="${i.id}" min="${tomorrowKey()}"></label><button data-lo="drop" data-id="${i.id}" class="lodrop">Drop</button></span></div>`).join("")}<button class="quiet" data-lo="keepall">Keep all for today</button></div>`:""}</div>`:""}
    ${heroHTML}
    ${hasAny?`<section class="also"><div class="sh"><h3>${hero?"Also today":"Today"}</h3><span>${rest.length?rest.length+" left":"nothing else"}</span></div>
      <div class="brows">${vis.map(row).join("")}</div>
      ${more>0?`<a class="quiet" href="#lists" data-goto="must">+ ${more} more</a>`:""}
      ${homeAdd?`<div class="hinput"><input id="hAdd" placeholder="Add a to-do, press Enter" aria-label="Add a to-do"><button class="quiet" data-hadd>Cancel</button></div>`:`<button class="quiet" data-hadd>+ Add something</button>`}
      ${doneM.length?`<button class="quiet" data-hshowdone>${homeShowDone?"▾":"▸"} ✓ ${doneM.length} done today</button>${homeShowDone?`<div class="brows">${doneM.map(row).join("")}</div>`:""}`:""}</section>
    <section class="joy"><div class="sh"><h3>☺ Happy about</h3><a class="quiet" href="#wins">Wins →</a></div>
      ${doneM.length?`<p class="jstat">You've done <b>${doneM.length} thing${doneM.length>1?"s":""}</b> today 💚</p>`:""}
      <div class="jchips">${happy.map(i=>`<span class="jchip">${esc(i.text)}</span>`).join("")||'<span class="jempty">Nothing yet. Even getting up counts.</span>'}</div>
      ${homeJoy?`<div class="hinput"><input id="hJoy" placeholder="A good thing, press Enter" aria-label="Add a good thing"><button class="quiet" data-hjoy>Cancel</button></div>`:`<button class="quiet" data-hjoy>+ Add a good thing</button>`}</section>
    <nav class="quietbar" aria-label="More">${cnt("important")?`<a href="#lists" data-goto="later">Can wait · ${cnt("important")}</a>`:""}${(b.letgo||[]).length?`<a href="#lists" data-goto="letgo">Let it go · ${(b.letgo||[]).length}</a>`:""}${(b.ideas||[]).length?`<a href="#lists" data-goto="ideas">Ideas · ${(b.ideas||[]).length}</a>`:""}<a href="#routine">Full routine</a></nav>`:""}`;
  if(justDone){const cb=homeEl.querySelector(`[data-hdone$=":${justDone}"]`), r=cb&&cb.closest(".row"); if(r){r.classList.add("justdone"); sparkle(r)}}
  const f=homeEl.querySelector("#hAdd,#hJoy"); if(f) f.focus();}
homeEl.addEventListener("click",e=>{const t=e.target.closest("button,a"); if(!t||t.closest("[data-lo],.lodate")) return; const h=homeHero();
  if(t.hasAttribute("data-hdump")){openVoice(true); return}
  if(t.hasAttribute("data-hphoto")){const ph=document.querySelector("[data-photo]"); ph&&ph.click(); return}
  if(t.hasAttribute("data-hstart")&&h){startTimer(h.kind==="slot"?h.id:focusTask(h.id)); return}
  if(t.hasAttribute("data-hstep")&&h&&stuck[h.id]){startTimer(null,{task:stuck[h.id].step,mins:2,brk:false}); return}
  if(t.hasAttribute("data-hdonehero")&&h){if(h.kind==="slot") toggleSlotDone(h.id,true); else toggleTask(h.k,h.id); return}
  if(t.hasAttribute("data-hstuck")&&h){stuckAI(h); return}
  if(t.hasAttribute("data-hlater")&&h){
    if(h.kind==="slot"){const r=state.routine, i=r.findIndex(x=>x.id===h.id); r.push(r.splice(i,1)[0])}
    else{const L=state.buckets[h.k], i=L.findIndex(x=>x.id===h.id); L.push(L.splice(i,1)[0])}
    const n=homeHero(); render(); save(); toast(n&&n.id===h.id?"It's the only thing left. Take a breather first?":"Okay, later. Here's something else."); return}
  if(t.dataset.hdone){const [k,id]=t.dataset.hdone.split(":"); toggleTask(k,id); return}
  if(t.dataset.hfocus){focusTask(t.dataset.hfocus); render(); window.scrollTo({top:0,behavior:"smooth"}); return}
  if(t.hasAttribute("data-hshowdone")){homeShowDone=!homeShowDone; renderHome(); return}
  if(t.hasAttribute("data-hadd")){homeAdd=!homeAdd; renderHome(); return}
  if(t.hasAttribute("data-hjoy")){homeJoy=!homeJoy; renderHome(); return}
  if(t.hasAttribute("data-hlo")){homeLO=!homeLO; renderHome(); return}});
homeEl.addEventListener("keydown",e=>{const el=e.target; if(el.id!=="hAdd"&&el.id!=="hJoy") return;
  if(e.key==="Escape"){homeAdd=false; homeJoy=false; renderHome(); return}
  if(e.key!=="Enter") return; const v=el.value.trim(); if(!v) return;
  const k=el.id==="hAdd"?"todo":"happy"; (state.buckets[k]=state.buckets[k]||[])[k==="todo"?"push":"unshift"](mk(v));
  render(); save(); toast(k==="todo"?"Added to today":"Nice, that counts 💚"); const f=homeEl.querySelector("#"+el.id); f&&f.focus();});
document.addEventListener("click",e=>{const a=e.target.closest("[data-goto]"); if(!a) return; e.preventDefault(); const g=a.dataset.goto;
  filter=g==="later"?"later":g==="must"?"must":"all";
  document.querySelectorAll("#filters button,#fchips button").forEach(x=>x.classList.toggle("on",x.dataset.f===filter));
  if(location.hash!=="#lists") location.hash="lists"; else renderPage();
  if(g==="letgo"||g==="ideas") setTimeout(()=>{const el=document.getElementById("sec-"+g); if(el){el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.add("flash")}},150);});

/* ---------- save (private to you) ---------- */
let docRef=null, saveT=null, loaded=false;
function save(){if(!docRef) return; clearTimeout(saveT); saveT=setTimeout(()=>{docRef.set({state:JSON.stringify(state),updated:Date.now()}).catch(()=>{})},600);}
(async()=>{try{
  const [db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")]);
  if(!db||!user) return; const id=await user.id(); if(!id) return;
  docRef=db.doc(`data/users/${id}/planner/today`);
  const snap=await docRef.get();
  if(snap.exists){const d=snap.data(); try{const s=JSON.parse(d.state); if(s&&s.buckets){if(!s.moods) s.moods=state.moods; state=s; carryOver(); renderPage()}}catch(e){}}
}catch(e){}finally{loaded=true; if(!state.profile) openOnboarding(false)}})();

carryOver();
renderPage();
