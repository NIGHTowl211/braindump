<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Brain Dump Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: frosted app shell — icon rail, planner column (dump + clock + calendar), sorted-day column */
:root{
  --bg:#dbe3ea; --bg2:#eef2f6;
  --shell:rgba(240,244,248,.72);
  --panel:#e6ecf1; --card:#f3f6f9; --card-hi:#fbfcfd;
  --line:rgba(20,30,45,.08); --line2:rgba(20,30,45,.14);
  --ink:#141b2b; --ink2:#3a4456; --muted:#6c7787; --faint:#9aa4b2;
  --chip:#dde4eb; --hatch:rgba(20,30,45,.045);
  --solid:#141b2b; --on-solid:#f3f6f9;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 10px 30px -12px rgba(30,50,75,.25);
  --urgent:#d9574a; --important:#d39a2c; --todo:#4f7fbf; --happy:#3e9a6c; --letgo:#8d7bc4; --ideas:#c25d98;
  --cheer-bg:linear-gradient(120deg,#16a34a,#4fc96a 60%,#a3d94a); --cheer-fg:#fff; --cheer-sh:0 8px 20px -8px rgba(22,163,74,.75);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --bg2:#141b23;
  --shell:rgba(22,29,38,.78);
  --panel:#18202a; --card:#1e2733; --card-hi:#243041;
  --line:rgba(220,232,245,.07); --line2:rgba(220,232,245,.13);
  --ink:#e8edf3; --ink2:#c3ccd7; --muted:#8a96a6; --faint:#5f6b7b;
  --chip:#2a3544; --hatch:rgba(220,232,245,.035);
  --solid:#e8edf3; --on-solid:#121820;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 14px 34px -14px rgba(0,0,0,.6);
  --urgent:#ef7466; --important:#e8b44e; --todo:#79a3dc; --happy:#5cc08e; --letgo:#a998e0; --ideas:#e78bc2;
  --cheer-bg:linear-gradient(120deg,#bfeccf,#ffe7a3); --cheer-fg:#1d3b2b; --cheer-sh:0 6px 16px -8px rgba(92,192,142,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1117; --bg2:#141b23;
  --shell:rgba(22,29,38,.78);
  --panel:#18202a; --card:#1e2733; --card-hi:#243041;
  --line:rgba(220,232,245,.07); --line2:rgba(220,232,245,.13);
  --ink:#e8edf3; --ink2:#c3ccd7; --muted:#8a96a6; --faint:#5f6b7b;
  --chip:#2a3544; --hatch:rgba(220,232,245,.035);
  --solid:#e8edf3; --on-solid:#121820;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 14px 34px -14px rgba(0,0,0,.6);
  --urgent:#ef7466; --important:#e8b44e; --todo:#79a3dc; --happy:#5cc08e; --letgo:#a998e0; --ideas:#e78bc2;
  --cheer-bg:linear-gradient(120deg,#bfeccf,#ffe7a3); --cheer-fg:#1d3b2b; --cheer-sh:0 6px 16px -8px rgba(92,192,142,.6);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:radial-gradient(120% 80% at 0% 0%,var(--bg2),var(--bg) 60%);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:15px;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--todo);outline-offset:2px}

.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:84px 1fr;gap:18px;background:var(--shell);border:1px solid var(--line);border-radius:30px;padding:16px;backdrop-filter:blur(18px);box-shadow:var(--shadow)}

/* rail */
.rail{display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--card);border-radius:22px;padding:10px 0;border:1px solid var(--line)}
.rail button{width:56px;height:56px;border:0;border-radius:18px;background:transparent;display:grid;place-items:center;color:var(--ink2);transition:background .15s}
.rail button:hover{background:var(--chip)}
.rail button.on{background:var(--chip)}
.rail .logo{background:var(--solid);color:var(--on-solid);height:64px;width:64px;border-radius:20px}
.rail .logo:hover{background:var(--solid)}
.rail .spacer{flex:1}
.rail svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px;padding:8px 6px 2px;flex-wrap:wrap}
.top .crumb{color:var(--muted);font-size:17px}
.top .crumb b{color:var(--ink);font-weight:600}
.top .ex{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--muted);letter-spacing:.02em}
.top .grow{flex:1}
.themebtn{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.themebtn button{border:0;background:transparent;border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
.themebtn button.on{background:var(--solid);color:var(--on-solid)}

.cols{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px}
/* bucket cards */
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;align-items:start}
.bcard{--c:var(--todo);background:color-mix(in srgb,var(--c) 6%,var(--card));border:1px solid color-mix(in srgb,var(--c) 18%,var(--line));border-radius:24px;padding:20px 20px 14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.bcard.wide{grid-column:1/-1}
.bcard.happy{background:color-mix(in srgb,var(--happy) 16%,var(--card));border-color:color-mix(in srgb,var(--happy) 35%,transparent)}
.bhead{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;text-align:left;width:100%}
.bico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-size:17px;flex:none}
.btitle{font-size:16px;font-weight:600;color:var(--ink)}
.bhint{font-size:12px;color:var(--muted)}
.bcount{margin-left:auto;font-size:13px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:3px 11px;font-variant-numeric:tabular-nums}
.brows{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:flex-start;gap:12px;padding:9px 6px;border-radius:12px;min-width:0}
.row:hover{background:color-mix(in srgb,var(--c) 7%,transparent)}
.row .cb{width:22px;height:22px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 55%,var(--line2));background:transparent;flex:none;margin-top:1px;display:grid;place-items:center;padding:0}
.row .cb svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;opacity:0}
.row.done .cb{background:var(--c);border-color:var(--c)}
.row.done .cb svg{opacity:1}
.row .txt{flex:1;min-width:0;line-height:1.45;overflow-wrap:anywhere;color:var(--ink)}
.row.done .txt{text-decoration:line-through;color:var(--faint)}
.row .x{opacity:0;width:24px;height:24px;font-size:16px}
.row:hover .x,.row .x:focus-visible{opacity:1}
@media (hover:none){.row .x{opacity:.5}}
.row .bullet{width:22px;flex:none;text-align:center;color:var(--c);font-size:15px}
.more{border:0;background:transparent;color:var(--muted);font-size:13px;text-align:left;padding:4px 6px;align-self:flex-start;border-radius:8px}
.more:hover{color:var(--ink);background:color-mix(in srgb,var(--c) 8%,transparent)}
.bcard.collapsed .brows,.bcard.collapsed .more{display:none}
.bempty{color:var(--faint);font-size:13px;padding:4px 6px}
.row .mv{opacity:0;border:0;background:transparent;color:var(--faint);width:26px;height:24px;border-radius:8px;font-size:14px}
.row:hover .mv,.row .mv:focus-visible,.row .mv[aria-expanded="true"]{opacity:1}
.row .mv:hover{background:var(--chip);color:var(--ink)}
@media (hover:none){.row .mv{opacity:.6}}
.row{position:relative}
.row[draggable="true"]{cursor:grab}
.row.dragging{opacity:.4}
.bcard.dropok{outline:2px dashed var(--c);outline-offset:3px}
.movemenu{position:absolute;right:6px;top:calc(100% - 4px);z-index:20;background:var(--card-hi);border:1px solid var(--line2);border-radius:14px;box-shadow:0 14px 34px -10px rgba(0,0,0,.35);padding:6px;display:flex;flex-direction:column;min-width:190px}
.movemenu .mt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:6px 10px 4px}
.movemenu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;font-size:14px}
.movemenu button:hover{background:var(--chip)}
.movemenu .dot{width:9px;height:9px;border-radius:50%}

/* history drawer */
.hd{position:fixed;inset:0;z-index:45;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(8px);display:flex;justify-content:flex-end}
.hdbox{width:min(480px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding:max(22px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) 20px;gap:14px}
.hdbox .vohead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.hlist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px}
.hitem{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.hitem .hdate{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.hitem .htext{line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink2);max-height:7.8em;overflow:hidden}
.hitem.open .htext{max-height:none}
.hitem .hacts{display:flex;gap:6px;flex-wrap:wrap}
.hitem .hacts button{border:1px solid var(--line2);background:var(--card-hi);border-radius:10px;padding:6px 11px;font-size:12px}
.hitem .hacts button:hover{background:var(--chip)}
.hitem .hacts .del{margin-left:auto;color:var(--urgent);border-color:transparent;background:transparent}
.panel{background:var(--panel);border-radius:26px;padding:24px 22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:18px;min-width:0}
.panel h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:-10px}

/* filter list */
.filters{display:flex;flex-direction:column;gap:2px}
.filters button{--c:var(--muted);display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 10px;border-radius:14px;text-align:left;color:var(--muted);transition:background .15s,color .15s}
.filters button:hover{background:color-mix(in srgb,var(--c) 7%,transparent)}
.filters .fi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--c);flex:none;transition:background .15s}
.filters button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.filters .fl{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.filters .fl b{font-weight:500;font-size:15px}
.filters .fl small{font-size:12px;color:var(--faint)}
.filters button.on{color:var(--ink);background:color-mix(in srgb,var(--c) 10%,transparent)}
.filters button.on .fl b{font-weight:600}
.filters button.on .fi{background:var(--c);color:#fff}
.filters .n{margin-left:auto;font-size:13px;font-weight:600;color:var(--c);font-variant-numeric:tabular-nums}
.filters [data-f="must"]{--c:var(--urgent)} .filters [data-f="later"]{--c:var(--important)} .filters [data-f="all"]{--c:var(--todo)}
.viewhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.viewhead p{margin:0;color:var(--muted);font-size:14px}
.bgrid{animation:fadein .25s ease}
@keyframes fadein{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.bcard.flash{animation:flash 1.2s ease}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 45%,transparent)}}

/* voice overlay */
.vo{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vobox{width:min(720px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:18px}
.vohead{display:flex;align-items:center;gap:12px}
.vohead h3{margin:0;font-size:22px;font-weight:600}
.vohead .close{margin-left:auto;border:0;background:var(--chip);width:38px;height:38px;border-radius:12px;font-size:20px}
.vomic{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.bigmic{width:110px;height:110px;border-radius:50%;border:0;background:var(--solid);color:var(--on-solid);display:grid;place-items:center;transition:transform .15s}
.bigmic:hover{transform:scale(1.04)}
.bigmic svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.6}
.bigmic.live{background:var(--urgent);color:#fff;animation:bigpulse 1.4s infinite}
@keyframes bigpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--urgent) 40%,transparent)}50%{box-shadow:0 0 0 22px transparent}}
.wave{display:flex;align-items:center;gap:5px;height:40px}
.wave i{width:5px;height:8px;border-radius:3px;background:var(--faint)}
.wave.live i{background:var(--urgent);animation:bar 1s ease-in-out infinite}
.wave.live i:nth-child(2n){animation-delay:.15s}.wave.live i:nth-child(3n){animation-delay:.3s}.wave.live i:nth-child(5n){animation-delay:.45s}
@keyframes bar{0%,100%{height:8px}50%{height:36px}}
.vostate{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;text-align:center;max-width:52ch;line-height:1.5}
.vostate .rd{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.vostate.live{color:var(--urgent);font-weight:600}
.vostate.live .rd{background:var(--urgent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.votext{width:100%;min-height:180px;resize:vertical;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;font-size:17px;line-height:1.6;outline:none}
.votext:focus{border-color:var(--line2)}
.vofoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vofoot .go{padding:14px 22px;font-size:15px}
.ghost{border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:13px 18px;font-size:14px}

.card{background:var(--card);border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow);padding:18px}

/* dump */
.dump textarea{width:100%;min-height:130px;resize:vertical;border:0;background:transparent;outline:none;line-height:1.55;font-size:15px}
.dump textarea::placeholder{color:var(--faint)}
.dumpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.mic{width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:var(--card-hi);display:grid;place-items:center}
.mic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.mic.live{background:var(--urgent);color:#fff;border-color:transparent;animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--urgent) 45%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.dumpbar select{border:1px solid var(--line2);background:var(--card-hi);border-radius:12px;padding:9px 10px;font-size:13px}
.go{margin-left:auto;border:0;background:var(--solid);color:var(--on-solid);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px}
.go:disabled{opacity:.55;cursor:default}
.status{font-size:13px;color:var(--muted);min-height:18px}

/* clock */
.clock{display:flex;align-items:center;gap:20px}
.clock svg{width:112px;height:112px;flex:none}
.clock{gap:16px;padding:16px}
.clock .t{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.clock .d{color:var(--muted);margin-top:4px}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;color:var(--ink2);font-size:16px;padding:0 4px}
.calhead button{border:0;background:transparent;width:32px;height:32px;border-radius:10px;font-size:18px;color:var(--ink2)}
.calhead button:hover{background:var(--chip)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 2px;text-align:center;font-variant-numeric:tabular-nums}
.cal .h{color:var(--muted);font-size:13px;padding-bottom:10px}
.cal .c{height:38px;display:grid;place-items:center;border-radius:12px;font-size:15px;color:var(--ink2)}
.cal .c.o{color:var(--faint)}
.cal .c.today{background:var(--solid);color:var(--on-solid);font-weight:600}
.cal .c.has{position:relative}
.cal .c.has::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--urgent)}

/* right panel */
.addrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;box-shadow:var(--shadow)}
.addrow input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}
.addrow input::placeholder{color:var(--ink2)}
.kbd{font-size:12px;background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--muted);white-space:nowrap}
.addrow select{border:0;background:var(--chip);border-radius:10px;padding:6px 8px;font-size:13px}

.note{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;line-height:1.5;color:var(--ink2);display:flex;gap:12px}
.note b{color:var(--happy)}

.sec{display:flex;flex-direction:column;gap:8px}
.sechead{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:6px 4px;font-size:16px;color:var(--ink2);text-align:left}
.sechead svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
.sec.closed .sechead svg{transform:rotate(-90deg)}
.sec.closed .items{display:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.sechead .n{font-size:13px;font-weight:600;background:var(--chip);border-radius:7px;padding:1px 8px;font-variant-numeric:tabular-nums}
.sechead .hint{font-size:12px;color:var(--faint);margin-left:auto}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 12px;min-width:0}
.item:hover{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 7px)}
.item .grip{color:var(--faint);letter-spacing:-1px;font-size:14px}
.tick{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card-hi);border-radius:11px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.tick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.4}
.item.done .txt{text-decoration:line-through;color:var(--faint)}
.item.done .tick{background:var(--solid);color:var(--on-solid);border-color:transparent}
.x{border:0;background:transparent;color:var(--faint);font-size:18px;width:28px;height:28px;border-radius:8px}
.x:hover{background:var(--chip);color:var(--ink)}
.empty{color:var(--faint);font-size:13px;padding:4px 6px}
.item.soft .tick{display:none}

/* routine */
.routine{display:flex;flex-direction:column;gap:0}
.slot{display:grid;grid-template-columns:72px 14px 1fr;gap:12px;align-items:stretch}
.slot .tm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:12px;text-align:right}
.slot .rail2{display:flex;flex-direction:column;align-items:center}
.slot .rail2 i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink2);margin-top:14px;background:var(--panel)}
.slot .rail2 b{flex:1;width:2px;background:var(--line2)}
.slot:last-child .rail2 b{background:transparent}
.slot .blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;min-width:0}
.slot .blk span{flex:1;min-width:0;overflow-wrap:anywhere}
.slot .blk em{font-style:normal;font-size:12px;color:var(--muted);background:var(--chip);border-radius:7px;padding:2px 8px;white-space:nowrap}
.slot.brk .blk{background:transparent;border-style:dashed;color:var(--muted)}
.slot.brk .rail2 i{border-color:var(--happy)}

.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;align-self:flex-start}
.tabs button{border:0;background:transparent;border-radius:10px;padding:7px 14px;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--solid);color:var(--on-solid)}


/* happy buttons */
.cheer{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--cheer-fg);font-weight:700;font-size:14px;padding:10px 18px;border-radius:99px;
  background:var(--cheer-bg);box-shadow:var(--cheer-sh);transition:transform .15s,box-shadow .15s}
.cheer:hover{box-shadow:var(--cheer-sh),0 0 0 4px color-mix(in srgb,var(--happy) 22%,transparent)}
.cheer:hover{transform:translateY(-1px) scale(1.02)}
.cheer.small{font-size:13px;padding:8px 14px;align-self:flex-start;margin-top:2px}
.ghost.photo{padding:9px 12px;font-size:13px}
.bcard[style*="--letgo"]{background:color-mix(in srgb,var(--letgo) 10%,var(--card))}

/* pages */
.page{display:flex;flex-direction:column;gap:18px;animation:fadein .25s ease}
.pghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px}
.back:hover{background:var(--chip)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:32px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;
  background:linear-gradient(130deg,color-mix(in srgb,var(--happy) 26%,var(--card)),color-mix(in srgb,var(--important) 20%,var(--card)));border:1px solid color-mix(in srgb,var(--happy) 30%,transparent);box-shadow:var(--shadow)}
.hero h2{margin:0;font-size:clamp(26px,4vw,38px);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:8px 0 0;color:var(--ink2);font-size:16px;max-width:46ch;line-height:1.5}
.ring{width:150px;height:150px;flex:none}
.ring .big{font-size:34px;font-weight:700;fill:var(--ink)}
.ring .sm{font-size:12px;fill:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.conf{position:absolute;inset:0;pointer-events:none}
.conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:0;animation:fall 2.4s ease-out forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(260px) rotate(540deg)}}
.prow{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;line-height:1.45}
.prow .ck{width:22px;height:22px;border-radius:50%;background:var(--happy);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.prow .op{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none}
.prow small{color:var(--faint);margin-left:auto;white-space:nowrap;font-size:12px}

/* mood */
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mood{--c:var(--muted);border:1.5px solid var(--line2);background:var(--card);border-radius:18px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;transition:transform .12s}
.mood .e{font-size:30px}
.mood:hover{transform:translateY(-2px)}
.mood.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--card));font-weight:600}
.mnote{width:100%;min-height:90px;resize:vertical;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;line-height:1.5;outline:none}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-variant-numeric:tabular-nums}
.mcal .h{color:var(--muted);font-size:12px;text-align:center;padding-bottom:4px}
.mcal .c{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);background:var(--card);border:1px solid var(--line);gap:2px}
.mcal .c.o{visibility:hidden}
.mcal .c.has{background:color-mix(in srgb,var(--c) 30%,var(--card));border-color:color-mix(in srgb,var(--c) 50%,transparent);color:var(--ink)}
.mcal .c .me{font-size:14px;line-height:1}
.mcal .c.today{outline:2px solid var(--solid);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
@media (max-width:640px){.hero{padding:22px;gap:18px}.ring{width:120px;height:120px}.mcal .c .me{display:none}}

/* editable routine */
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rhead label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.rhead input[type=time]{border:1px solid var(--line2);background:var(--card-hi);border-radius:10px;padding:6px 8px}
.rhead .ends{font-size:13px;color:var(--muted)}
.rhead .warn{font-size:12px;color:var(--urgent);font-weight:600}
.rhead .grow{flex:1}
.rhint{font-size:12px;color:var(--faint);margin:0 0 10px}
.slot{grid-template-columns:62px 14px 1fr}
.slot .blk{padding:6px 8px 6px 12px;gap:6px}
.slot .blk span.grip2{flex:none}
.slot .blk input.tt{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;padding:6px 0}
.slot .blk input.tt:focus{border-bottom:1px dashed var(--line2)}
.slot .blk select{border:0;background:var(--chip);border-radius:8px;padding:4px 6px;font-size:12px;color:var(--ink2)}
.slot .sb{border:0;background:transparent;color:var(--faint);width:26px;height:26px;border-radius:8px;font-size:13px;flex:none}
.slot .sb:hover{background:var(--chip);color:var(--ink)}
.slot .sb:disabled{opacity:.25;cursor:default}
.slot .grip2{cursor:grab;color:var(--faint);font-size:13px;letter-spacing:-1px;padding:0 2px;user-select:none}
.slot.dragging{opacity:.4}
.slot.dropline .blk{box-shadow:0 -3px 0 0 var(--todo)}
.slot.brk .blk{border-style:dashed}
.slot.brk .blk::before{content:"☕";font-size:14px}
.radd{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;padding-left:76px}
@media (max-width:640px){.radd{padding-left:0}.slot{grid-template-columns:46px 12px 1fr}.slot .sb.up,.slot .sb.dn{display:none}}

/* onboarding */
.ob .vobox{gap:20px}
.obsteps{display:flex;gap:6px}
.obsteps i{height:5px;flex:1;border-radius:3px;background:var(--chip)}
.obsteps i.on{background:var(--solid)}
.ob h3{font-size:26px}
.ob p.lead{margin:-8px 0 0;color:var(--muted);line-height:1.5}
.oinput{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:14px 16px;font-size:16px;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line2);background:var(--card);border-radius:99px;padding:9px 14px;font-size:14px}
.chips button.on{background:color-mix(in srgb,var(--happy) 18%,var(--card));border-color:var(--happy);font-weight:600}
.times{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.times label{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
.times input{border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:14px;font-size:20px;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1.5px solid var(--line2);background:var(--card);border-radius:18px;padding:16px}
.opt .e{font-size:24px}
.opt b{display:block;font-size:16px;margin-bottom:2px}
.opt span span{color:var(--muted);font-size:13px;line-height:1.45}
.opt.on{border-color:var(--solid);background:var(--card-hi);box-shadow:var(--shadow)}
.obfoot{display:flex;gap:10px;align-items:center}
.obfoot .go{margin-left:auto}
.oberr{font-size:13px;color:var(--urgent);min-height:16px}

/* talk button */
.talk{width:100%;display:flex;align-items:center;gap:14px;border:0;border-radius:18px;padding:14px 16px;background:var(--solid);color:var(--on-solid);text-align:left;transition:transform .15s,box-shadow .15s;box-shadow:0 10px 22px -12px rgba(20,27,43,.6)}
.talk:hover{transform:translateY(-1px)}
.talk .tmic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--on-solid) 14%,transparent);flex:none;position:relative}
.talk .tmic::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid color-mix(in srgb,var(--on-solid) 25%,transparent);animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.35);opacity:0}}
.talk svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.talk b{display:block;font-size:16px}
.talk small{opacity:.7;font-size:12px}
.talk .mini{margin-left:auto;display:flex;gap:3px;align-items:center;height:22px}
.talk .mini i{width:3px;border-radius:2px;background:currentColor;opacity:.55;animation:bar2 1.2s ease-in-out infinite}
.talk .mini i:nth-child(1){height:8px}.talk .mini i:nth-child(2){height:16px;animation-delay:.2s}.talk .mini i:nth-child(3){height:11px;animation-delay:.4s}.talk .mini i:nth-child(4){height:18px;animation-delay:.1s}.talk .mini i:nth-child(5){height:9px;animation-delay:.3s}
@keyframes bar2{50%{transform:scaleY(.45)}}
.dumpbar select{padding:8px}

/* done = reward */
.row .txt{flex:0 1 auto!important}
.row .mv{margin-left:auto}
.row .txt{background-image:linear-gradient(var(--c),var(--c));background-repeat:no-repeat;background-position:0 55%;background-size:0 2px;transition:color .3s}
.row.done .txt{text-decoration:none;background-size:100% 2px;color:var(--muted)}
.row.justdone .txt{animation:strike .45s ease-out forwards}
@keyframes strike{from{background-size:0 2px}to{background-size:100% 2px}}
.row.justdone .cb{animation:pop .4s ease}
@keyframes pop{40%{transform:scale(1.35)}}
.spark{position:absolute;left:14px;top:12px;pointer-events:none;font-size:13px;animation:spark .8s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
.donesep{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);opacity:.8;padding:8px 6px 2px}
.carry{font-size:11px;color:var(--muted);background:var(--chip);border-radius:99px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.progress{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;width:120px}
.progress i{display:block;height:100%;background:var(--happy);border-radius:3px;transition:width .5s}

/* now strip */
.nowstrip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:20px;padding:14px 18px;background:color-mix(in srgb,var(--todo) 10%,var(--card));border:1px solid color-mix(in srgb,var(--todo) 25%,transparent)}
.nowstrip .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--todo);font-weight:700}
.nowstrip .what{font-size:17px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.nowstrip .left{font-size:13px;color:var(--muted)}
.nowstrip .grow{flex:1}
.playbtn{border:0;background:var(--solid);color:var(--on-solid);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.slot.now .blk{border-color:var(--todo);box-shadow:0 0 0 2px color-mix(in srgb,var(--todo) 35%,transparent)}
.slot.now .rail2 i{background:var(--todo);border-color:var(--todo)}
.slot.past .blk{opacity:.55}
.slot .nowtag{font-size:11px;font-weight:700;color:var(--todo);white-space:nowrap}

/* timer */
.timer{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:40;background:var(--solid);color:var(--on-solid);border-radius:20px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 16px 40px -12px rgba(0,0,0,.5);max-width:calc(100% - 36px)}
.timer .tt2{display:flex;flex-direction:column;min-width:0}
.timer .tt2 small{opacity:.7;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.timer .clk{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.timer button{border:0;background:color-mix(in srgb,var(--on-solid) 15%,transparent);color:inherit;width:36px;height:36px;border-radius:11px;font-size:15px}

/* calm mode */
.calmbtn{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:9px 14px;font-size:14px;display:flex;gap:6px;align-items:center}
.calmbtn.on{background:color-mix(in srgb,var(--happy) 18%,var(--card));border-color:var(--happy);font-weight:600}
body.calm .cols{grid-template-columns:minmax(0,760px);justify-content:center}
body.calm .cols>.panel:first-child, body.calm .addrow, body.calm .note, body.calm .tabs, body.calm #routineView{display:none!important}
body.calm #listView{display:block!important}
body.calm .bcard:not(#sec-urgent){display:none}
.calmnote{display:none;color:var(--muted);font-size:14px;text-align:center;padding:6px}
body.calm .calmnote{display:block}

.leftovers{background:color-mix(in srgb,var(--letgo) 9%,var(--card))}
.lorow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 6px;border-top:1px solid var(--line)}
.lorow:first-child{border-top:0}
.lorow .txt{flex:1;min-width:180px;line-height:1.4}
.loacts{display:flex;gap:6px;flex-wrap:wrap}
.loacts button,.lodate{border:1px solid var(--line2);background:var(--card-hi);border-radius:10px;padding:6px 11px;font-size:13px;cursor:pointer;position:relative;display:inline-flex;align-items:center;color:var(--ink)}
.loacts button:hover,.lodate:hover{background:var(--chip)}
.lodate input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.loacts .lodrop{color:var(--urgent);border-color:transparent;background:transparent}
.movemenu .lodate{border:0;background:transparent;padding:8px 10px;font-size:14px}
.movemenu .lodate:hover{background:var(--chip)}

/* calendar page */
.calbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.calbar h2{margin:0;font-size:24px;font-weight:600}
.calbar p{margin:4px 0 0;color:var(--muted);font-size:14px}
.calbar .grow{flex:1}
.navs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.navs button{border:0;background:transparent;border-radius:10px;padding:7px 12px;font-size:14px;color:var(--ink2)}
.navs button:hover{background:var(--chip)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.cday{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 12px 12px;min-height:200px;min-width:0;box-shadow:var(--shadow);transition:transform .15s}
.cday:hover{transform:translateY(-2px)}
.cday .mstrip{position:absolute;inset:0 0 auto;height:5px;background:var(--mc)}
.cday.today{border-color:var(--solid);box-shadow:0 0 0 1.5px var(--solid),var(--shadow)}
.cday.future{background:transparent;border-style:dashed;box-shadow:none}
.cday .dh{display:flex;align-items:baseline;gap:6px}
.cday .dh b{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.cday .dh span{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.cday .dh .me{margin-left:auto;font-size:16px}
.dcount{font-size:12px;color:var(--faint);font-weight:600}
.dcount.has{color:var(--happy)}
.dlist{display:flex;flex-direction:column;gap:4px;min-width:0}
.di{font-size:12.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--ink2)}
.di.ok{color:var(--ink2)}
.di.plan{color:var(--muted)}
.di.more{color:var(--faint)}
.reps{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.rchip{font-size:11px;border-radius:99px;padding:2px 8px;background:var(--chip);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchip.ok{background:color-mix(in srgb,var(--happy) 18%,transparent);color:var(--happy);font-weight:600}
.mcal .c .dd{font-size:10px;font-weight:700;color:var(--happy)}
button.c{cursor:pointer}
.repitem{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.repitem:first-of-type{border-top:0}
.repitem .rt{flex:1;min-width:140px;font-weight:500}
.wdays{display:flex;gap:4px}
.wdays button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:12px;font-weight:600;color:var(--muted)}
.wdays button.on{background:var(--solid);color:var(--on-solid);border-color:transparent}
.wdays button:disabled{cursor:default}
.streak{font-size:12px;color:var(--happy);font-weight:600;min-width:100px}
.dsec{display:flex;flex-direction:column;gap:2px}
.dsec .mt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:4px 0}
.dsec .op{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:none}
.dsec .ck{width:18px;height:18px;font-size:10px}
@media (max-width:1100px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.week{grid-template-columns:1fr 1fr}.cday{min-height:150px}}

/* views */
body:not(.v-dashboard) .cols{grid-template-columns:minmax(0,880px);justify-content:center}
body:not(.v-dashboard) .cols>.panel:first-child{display:none}
body:not(.v-dashboard) #today .tabs{display:none}
body.v-lists #routineView, body.v-lists #nowStrip, body.v-lists #note{display:none!important}
body.v-lists #listView{display:block!important}
body.v-routine #today>:not(#routineView){display:none!important}
body.v-routine #routineView{display:block!important}
body.v-dashboard .fchips, body.v-dashboard .dumppill, body.calm .fchips{display:none}
.dumppill{margin-left:auto;align-self:center}
.ghost.sm{padding:8px 12px;font-size:13px;border-radius:12px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.ghost.sm:hover{background:var(--chip)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.fchips button.on{background:var(--solid);color:var(--on-solid);border-color:transparent}
.fchips .n{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.nowstrip .ghost.sm{background:var(--card-hi)}

/* routine flow */
.rwrap{display:flex;flex-direction:column;gap:16px}
.rwrap .radd{padding-left:0;margin-top:0}
.rtop{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.rtop h2{margin:0;font-size:24px;font-weight:600}
.rtop p{margin:4px 0 0;color:var(--muted);font-size:14px}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);cursor:pointer;margin-left:auto;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch span{width:40px;height:24px;border-radius:99px;background:var(--chip);position:relative;transition:background .2s;flex:none;border:1px solid var(--line2)}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--card-hi);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}

    <textarea class="votext" id="voText" placeholder="Your words show up here as you speak. You can also type or fix anything."></textarea>
    <div class="vofoot">
      <button class="ghost" id="voClear">Clear</button>
      <button class="ghost photo" data-photo>📷 Photo of a list</button>
      <div style="flex:1"></div>
      <button class="go" id="voSort">Sort my day</button>
    </div>
  </div>
</div>

<div class="hd" id="hd" hidden role="dialog" aria-modal="true" aria-labelledby="hdTitle">
  <div class="hdbox">
    <div class="vohead"><div><h3 id="hdTitle">Past dumps</h3><p>Everything you said, exactly as you said it.</p></div>
      <button class="close" id="hdClose" aria-label="Close">×</button></div>
    <div class="hlist" id="hlist"></div>
  </div>
</div>

<script>
const BUCKETS=[
  {k:"urgent",label:"Urgent",hint:"do today",group:"must"},
  {k:"important",label:"Important",hint:"schedule it",group:"later"},
  {k:"todo",label:"To-do",hint:"small tasks",group:"must"},
  {k:"happy",label:"Happy about",hint:"wins & good stuff",group:"soft",soft:true},
  {k:"letgo",label:"Let it go",hint:"not your burden today",group:"soft",soft:true},
  {k:"ideas",label:"Random good ideas",hint:"keep for later, not work",group:"soft",soft:true}
];
const uid=()=>Math.random().toString(36).slice(2,9);
const mk=t=>({id:uid(),text:t,done:false});

let state={example:true,dump:"",note:"Three must-dos today, that's it. The viva prep matters most, so it goes in your best focus hour.",
  buckets:{
    urgent:["Finish viva prep for Software Engineering","Submit lab record before 5pm"].map(mk),
    important:["Start research paper results section","Plan Waitless admin dashboard"].map(mk),
    todo:["Reply to group chat about project meet","Refill water bottle & eat lunch","Charge laptop"].map(mk),
    happy:["Finished UML diagrams yesterday","Slept 7 hours"].map(mk),
    letgo:["Comparing my progress to others","Redoing notes that are already fine"].map(mk),
    ideas:["A pastel theme pack for this app","Start a tiny journal of good days"].map(mk)
  },
  routine:[
    {task:"Viva prep: read your project summary out loud",mins:25},
    {task:"Break: stretch, water",mins:5,brk:true},
    {task:"Viva prep: answer 5 likely questions",mins:25},
    {task:"Lab record: finish last 2 experiments",mins:40},
    {task:"Break: snack, no phone",mins:10,brk:true},
    {task:"Charge laptop",mins:5}
  ],
  history:[{id:"ex1",at:Date.now()-3600e3,example:true,text:"ok so viva is tomorrow and i haven't even started properly, also lab record has to go today by 5 i think. and i need to reply in the group about the project meet. yaar i keep comparing myself with others, everyone seems so ahead. but i did finish the UML diagrams yesterday so that's good. slept 7 hours finally. also want to start the research paper results part and plan the Waitless admin dashboard. phone charge karna hai, laptop bhi. and i keep wanting to redo my notes even though they're fine."}]};
let filter="must", tab="list", closed={}, expanded={}, openMenu=null, justDone=null;
const CHEERS=["Nice! One down 🎉","Look at you go ✨","Done and dusted 💪","Your brain did that 🧠","Tick! That felt good 🌟","Proud of you 💚"];
const LABEL=k=>BUCKETS.find(x=>x.k===k).label;
function moveItem(from,id,to){if(from===to) return;
  const src=state.buckets[from]||[], it=src.find(i=>i.id===id); if(!it) return;
  state.buckets[from]=src.filter(i=>i.id!==id); it.done=false;
  (state.buckets[to]=state.buckets[to]||[]).unshift(it); openMenu=null;
  render(); save(); toast(`Moved to ${LABEL(to)}`);}
function toast(msg){let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");
    t.style.cssText="position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--solid);color:var(--on-solid);padding:10px 18px;border-radius:12px;font-size:14px;z-index:60;transition:opacity .2s";
    document.body.appendChild(t);}
  t.textContent=msg; t.style.opacity="1"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity="0",1600);}

/* ---------- theme ---------- */
const root=document.documentElement;
function setTheme(t){ if(t==="system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme",t);
  document.querySelectorAll(".themebtn button").forEach(b=>b.classList.toggle("on",b.dataset.th===t));
  try{localStorage.setItem("bd-theme",t)}catch(e){} }
let th="system"; try{th=localStorage.getItem("bd-theme")||"system"}catch(e){}
setTheme(th);
document.querySelectorAll(".themebtn button").forEach(b=>b.onclick=()=>setTheme(b.dataset.th));
document.getElementById("railTheme").onclick=()=>{
  const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  setTheme(dark?"light":"dark");};

/* ---------- clock ---------- */
const cs=document.getElementById("clockSvg");
(function drawFace(){let s='<circle cx="100" cy="100" r="96" fill="none" stroke="var(--line)"/>';
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180, big=i%5===0, r1=big?80:84, r2=88;
    s+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}" stroke="${big?'var(--ink2)':'var(--faint)'}" stroke-width="${big?2:1}" stroke-linecap="round" opacity="${big?1:.6}"/>`;}
  s+='<line id="hH" x1="100" y1="100" x2="100" y2="52" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>';
  s+='<line id="hM" x1="100" y1="100" x2="100" y2="26" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>';
  s+='<line id="hS" x1="100" y1="112" x2="100" y2="22" stroke="var(--todo)" stroke-width="1.2" stroke-linecap="round"/>';
  s+='<circle cx="100" cy="100" r="8" fill="var(--ink)"/>';cs.innerHTML=s;})();
function tick(){const d=new Date(),h=d.getHours(),m=d.getMinutes(),sec=d.getSeconds();
  const rot=(id,deg)=>cs.querySelector(id).setAttribute("transform",`rotate(${deg} 100 100)`);
  rot("#hH",(h%12)*30+m*.5); rot("#hM",m*6+sec*.1); rot("#hS",sec*6);
  document.getElementById("clockT").textContent=d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});
  const day=d.getDate(), suf=(day%10===1&&day!==11)?"st":(day%10===2&&day!==12)?"nd":(day%10===3&&day!==13)?"rd":"th";
  const ds=d.toLocaleDateString("en-IN",{weekday:"short"})+", "+day+suf+" "+d.toLocaleDateString("en-IN",{month:"long"});
  document.getElementById("clockD").textContent=ds; document.getElementById("crumbDate").textContent=ds;}
tick(); setInterval(tick,1000);

/* ---------- calendar ---------- */
let calRef=new Date(); calRef.setDate(1);
function drawCal(){const now=new Date(),y=calRef.getFullYear(),mo=calRef.getMonth();
  document.getElementById("calTitle").textContent=calRef.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  let h=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<div class="h">${x}</div>`).join("");
  const start=(new Date(y,mo,1).getDay()+6)%7, days=new Date(y,mo+1,0).getDate(), prevDays=new Date(y,mo,0).getDate();
  const cells=Math.ceil((start+days)/7)*7;
  for(let i=0;i<cells;i++){const n=i-start+1; let cls="c",txt;
    if(n<1){txt=prevDays+n;cls+=" o"} else if(n>days){txt=n-days;cls+=" o"} else{txt=n;
      if(n===now.getDate()&&mo===now.getMonth()&&y===now.getFullYear()){cls+=" today"} }
    h+=`<div class="${cls}">${txt}</div>`;}
  document.getElementById("cal").innerHTML=h;}
document.getElementById("calPrev").onclick=()=>{calRef.setMonth(calRef.getMonth()-1);drawCal()};
document.getElementById("calNext").onclick=()=>{calRef.setMonth(calRef.getMonth()+1);drawCal()};
drawCal();

/* ---------- render ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHECK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>';
const CHEV='<svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>';
function render(){
  const b=state.buckets, open=k=>(b[k]||[]).filter(i=>!i.done).length;
  document.getElementById("nMust").textContent=open("urgent")+open("todo");
  document.getElementById("nLater").textContent=open("important");
  document.getElementById("nAll").textContent=BUCKETS.reduce((s,x)=>s+(b[x.k]||[]).length,0);
  document.querySelectorAll("[data-nf]").forEach(n=>{const v=n.dataset.nf==="must"?open("urgent")+open("todo"):open("important"); n.textContent=v||""});
  document.getElementById("exTag").hidden=!state.example;
  const note=document.getElementById("note");
  note.hidden=!state.note; note.innerHTML=`<b>●</b><span>${esc(state.note||"")}</span>`;

  const VIEWS={must:{t:"Must do today",keys:["urgent","todo","happy","letgo"]},
    later:{t:"Can wait",keys:["important","ideas"]},
    all:{t:"Everything",keys:["urgent","important","todo","happy","letgo","ideas"]}};
  const V=VIEWS[filter], show=BUCKETS.filter(x=>V.keys.includes(x.k));
  const left=V.keys.filter(k=>!BUCKETS.find(x=>x.k===k).soft).reduce((s,k)=>s+open(k),0);
  document.getElementById("viewTitle").textContent=V.t;
  const actAll=["urgent","important","todo"].flatMap(k=>b[k]||[]), dnAll=actAll.filter(i=>i.done).length;
  document.getElementById("viewSub").textContent=filter==="must"?(left?`${dnAll?dnAll+" done, ":""}${left} left. One at a time.`:"All done. Nice."):
    filter==="later"?"Not for today. Park it here, plan it later.":"Your whole dump, sorted.";
  const ICON={urgent:"🔥",important:"⭐",todo:"✓",happy:"☺",letgo:"🍃",ideas:"💡"};
  const LIMIT=4;
  let html='<div class="bgrid">'+leftoversHTML();
  for(const x of show){const list=(b[x.k]||[]).filter(i=>!(i.carried&&!i.decided&&filter==="must")), isClosed=closed[x.k], exp=expanded[x.k];
    const sorted=x.soft?list:[...list.filter(i=>!i.done),...list.filter(i=>i.done)];
    const openL=sorted.filter(i=>!i.done), doneL=x.soft?[]:sorted.filter(i=>i.done);
    const visOpen=exp?openL:openL.slice(0,LIMIT), hidden=openL.length-visOpen.length;
    const vis=x.soft?(exp?sorted:sorted.slice(0,LIMIT)):[...visOpen,...doneL];
    const hiddenSoft=x.soft?sorted.length-vis.length:0;
    const count=x.soft?list.length:list.filter(i=>!i.done).length;
    html+=`<div class="bcard${x.k==="urgent"?" wide":""}${x.k==="happy"?" happy":""}${isClosed?" collapsed":""}" style="--c:var(--${x.k})" id="sec-${x.k}">
      <button class="bhead" data-toggle="${x.k}" aria-expanded="${!isClosed}"><span class="bico">${ICON[x.k]}</span>
        <span><span class="btitle">${x.label}</span><br><span class="bhint">${x.hint}</span></span>
        <span class="bcount">${x.soft?count:count+" left"}</span></button>
      <div class="brows">${vis.length?vis.map(i=>`<div class="row${i.done?" done":""}" draggable="true" data-drag="${x.k}:${i.id}">
        ${x.soft?`<span class="bullet">•</span>`:`<button class="cb" data-done="${x.k}:${i.id}" aria-label="${i.done?"Mark not done":"Mark done"}"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></button>`}
        <span class="txt">${esc(i.text)}${i.carried&&!i.done?'<span class="carry">from yesterday</span>':""}${i.planned&&!i.done?'<span class="carry">planned</span>':""}${i.repId?'<span class="carry">🔁</span>':""}</span>
        <button class="mv" data-move="${x.k}:${i.id}" aria-label="Move to another bucket" aria-expanded="${openMenu===i.id}" title="Move">⇄</button>
        <button class="x" data-del="${x.k}:${i.id}" aria-label="Remove">×</button>
        ${openMenu===i.id?`<div class="movemenu" role="menu"><div class="mt">Move to</div>${BUCKETS.filter(y=>y.k!==x.k).map(y=>`<button role="menuitem" data-to="${x.k}:${i.id}:${y.k}"><span class="dot" style="background:var(--${y.k})"></span>${y.label}</button>`).join("")}${x.soft?"":`<div class="mt">Or plan it</div><button role="menuitem" data-lo="tmr" data-id="${i.id}">☀️ Tomorrow</button>${i.repId?`<button role="menuitem" data-rep="stop" data-id="${i.id}">🔁 Stop repeating</button>`:`<button role="menuitem" data-rep="daily" data-id="${i.id}">🔁 Repeat daily</button><button role="menuitem" data-rep="weekdays" data-id="${i.id}">🔁 Repeat weekdays</button><button role="menuitem" data-rep="weekly" data-id="${i.id}">🔁 Every ${new Date().toLocaleDateString("en-IN",{weekday:"long"})}</button>`}<label class="lodate" style="margin:2px 4px 4px">📅 Pick a day<input type="date" data-sched="${i.id}" min="${tomorrowKey()}"></label>`}</div>`:""}</div>`).join(""):`<div class="bempty">${x.k==="urgent"?"Nothing urgent. Breathe.":"Nothing here yet."}</div>`}</div>
      ${x.k==="happy"?`<a class="cheer small" href="#wins">🎉 See everything you did today</a>`:""}
      ${(hidden+hiddenSoft)>0?`<button class="more" data-more="${x.k}">+ ${hidden+hiddenSoft} more</button>`:exp&&sorted.length>LIMIT?`<button class="more" data-more="${x.k}">Show less</button>`:""}
    </div>`;}
  html+="</div>";
  document.getElementById("listView").innerHTML=html;
  if(justDone){const cb=document.querySelector(`[data-done$=":${justDone}"]`), row=cb&&cb.closest(".row");
    if(row){row.classList.add("justdone"); if(!matchMedia("(prefers-reduced-motion:reduce)").matches){
      ["✨","⭐","💚","✨","🎉"].forEach((e,k)=>{const sp=document.createElement("span"); sp.className="spark"; sp.textContent=e;
        const a=k/5*Math.PI*2; sp.style.setProperty("--dx",Math.cos(a)*34+"px"); sp.style.setProperty("--dy",Math.sin(a)*26-10+"px"); row.appendChild(sp); setTimeout(()=>sp.remove(),850)})}
      toast(CHEERS[Math.floor(Math.random()*CHEERS.length)]);}}
  const act=["urgent","important","todo"].flatMap(k=>b[k]||[]), dn=act.filter(i=>i.done).length;
  const pg=document.getElementById("prog"); pg.hidden=!act.length; pg.firstElementChild.style.width=(act.length?dn/act.length*100:0)+"%"; pg.title=dn+" of "+act.length+" done";
  renderNow();

  renderRoutine();
  renderHome();
}
document.getElementById("listView").addEventListener("click",e=>{
  if(e.target.closest(".lodate,[data-lo],[data-rep]")) return;
  const t=e.target.closest("[data-toggle],[data-done],[data-del],[data-more],[data-move],[data-to]");
  if(!t){if(openMenu&&!e.target.closest(".movemenu")){openMenu=null;render()} return}
  if(t.dataset.move){const id=t.dataset.move.split(":")[1]; openMenu=openMenu===id?null:id; render(); return}
  if(t.dataset.to){const [from,id,to]=t.dataset.to.split(":"); moveItem(from,id,to); return}
  openMenu=null;
  if(t.dataset.more){expanded[t.dataset.more]=!expanded[t.dataset.more];render();return}
  if(t.dataset.toggle){closed[t.dataset.toggle]=!closed[t.dataset.toggle];render();return}
  const [k,id]=(t.dataset.done||t.dataset.del).split(":"); const list=state.buckets[k];
  if(t.dataset.done){const it=list.find(i=>i.id===id); it.done=!it.done; it.doneAt=it.done?Date.now():null; if(it.done) it.decided=true;
    if(it.repId){const d=dkey(new Date()); state.repeatsDone=state.repeatsDone||{}; const arr=new Set(state.repeatsDone[d]||[]); it.done?arr.add(it.repId):arr.delete(it.repId); state.repeatsDone[d]=[...arr]}
    if(it.done){justDone=id; setTimeout(()=>{justDone=null},700)}
    else (state.routine||[]).forEach(sl=>{if(sl.taskId===id) sl.sdone=false})}
  else state.buckets[k]=list.filter(i=>i.id!==id);
  render(); save();
});
/* drag & drop between cards */
const lv=document.getElementById("listView"); let dragKey=null;
lv.addEventListener("dragstart",e=>{const r=e.target.closest("[data-drag]"); if(!r) return;
  dragKey=r.dataset.drag; r.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",dragKey)}catch(x){}});
lv.addEventListener("dragend",()=>{dragKey=null; lv.querySelectorAll(".dragging,.dropok").forEach(n=>n.classList.remove("dragging","dropok"))});
lv.addEventListener("dragover",e=>{const c=e.target.closest(".bcard"); if(!c||!dragKey) return; e.preventDefault();
  lv.querySelectorAll(".dropok").forEach(n=>n!==c&&n.classList.remove("dropok")); c.classList.add("dropok")});
lv.addEventListener("drop",e=>{const c=e.target.closest(".bcard"); if(!c||!dragKey) return; e.preventDefault();
  const [from,id]=dragKey.split(":"); moveItem(from,id,c.id.replace("sec-",""))});

/* history drawer */
const hd=document.getElementById("hd");
function fmtWhen(ts){const d=new Date(ts), now=new Date(), y=new Date(now); y.setDate(now.getDate()-1);
  const time=d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});
  if(d.toDateString()===now.toDateString()) return "Today, "+time;
  if(d.toDateString()===y.toDateString()) return "Yesterday, "+time;
  return d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})+", "+time;}
function renderHist(){const h=state.history||[];
  document.getElementById("hlist").innerHTML=h.length?h.map(x=>`<div class="hitem" data-h="${x.id}">
    <div class="hdate">${fmtWhen(x.at)}${x.example?'<span class="ex" style="font-size:11px;padding:2px 8px;border-radius:99px;background:var(--chip)">Example</span>':""}</div>
    <div class="htext">${esc(x.text)}</div>
    <div class="hacts"><button data-hx="expand">Read all</button><button data-hx="reuse">Use again</button><button data-hx="copy">Copy</button><button class="del" data-hx="del">Delete</button></div></div>`).join("")
    :`<div class="bempty">No dumps yet. Tap the mic and talk it out, your words will be kept here.</div>`;}
document.getElementById("railHist").onclick=()=>{renderHist(); if(!vo.hidden) closeVoice(); hd.hidden=false};
document.getElementById("hdClose").onclick=()=>hd.hidden=true;
hd.addEventListener("click",e=>{if(e.target===hd){hd.hidden=true;return}
  const b=e.target.closest("[data-hx]"); if(!b) return; const card=b.closest("[data-h]"), id=card.dataset.h;
  const item=(state.history||[]).find(x=>x.id===id); if(!item) return;
  if(b.dataset.hx==="expand"){card.classList.toggle("open"); b.textContent=card.classList.contains("open")?"Show less":"Read all"}
  if(b.dataset.hx==="reuse"){hd.hidden=true; dumpEl.value=item.text; openVoice(false)}
  if(b.dataset.hx==="copy"){navigator.clipboard?.writeText(item.text).then(()=>toast("Copied"),()=>toast("Couldn't copy here"))}
  if(b.dataset.hx==="del"){
    if(b.dataset.sure){state.history=state.history.filter(x=>x.id!==id); save(); renderHist(); toast("Deleted")}
    else{b.dataset.sure="1"; b.textContent="Tap again to delete"}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!hd.hidden) hd.hidden=true});

document.querySelectorAll("#filters button,#fchips button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;
  document.querySelectorAll("#filters button,#fchips button").forEach(x=>x.classList.toggle("on",x.dataset.f===b.dataset.f));render()});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.getElementById("listView").hidden=tab!=="list";
  document.getElementById("routineView").hidden=tab!=="routine";});
document.getElementById("addInput").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return; const v=e.target.value.trim(); if(!v) return;
  const k=document.getElementById("addTo").value; (state.buckets[k]=state.buckets[k]||[]).unshift(mk(v));
  const inView={must:["urgent","todo","happy","letgo"],later:["important","ideas"]}[filter];
  e.target.value=""; if(inView&&!inView.includes(k)){filter="all";
    document.querySelectorAll("#filters button,#fchips button").forEach(x=>x.classList.toggle("on",x.dataset.f==="all"))}
  render(); save();});
document.querySelectorAll(".rail [data-jump]").forEach(b=>b.onclick=()=>openVoice(true));
document.querySelector(".rail .logo").onclick=()=>{location.hash=""};
document.addEventListener("click",e=>{if(e.target.closest("[data-opendump]")) openVoice(true)});

/* ---------- voice ---------- */
const status=document.getElementById("status"), dumpEl=document.getElementById("dumpText");
let rec=null, listening=false;
const vo=document.getElementById("vo"), voText=document.getElementById("voText"), bigMic=document.getElementById("bigMic"),
  wave=document.getElementById("wave"), voState=document.getElementById("voState"), voStateTxt=document.getElementById("voStateTxt");
function setLive(on,msg){listening=on; bigMic.classList.toggle("live",on); wave.classList.toggle("live",on); voState.classList.toggle("live",on);
  bigMic.setAttribute("aria-label",on?"Stop recording":"Start recording");
  voStateTxt.textContent=msg||(on?"Recording… tap the mic to stop":"Tap the mic and start talking");}
function startRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setLive(false,"Mic is blocked inside this preview. Use your keyboard's voice typing instead: Windows Win + H · Mac press Fn twice · Phone tap 🎤 on the keyboard.");voText.focus();return}
  rec=new SR(); rec.lang=document.getElementById("voLang").value; rec.continuous=true; rec.interimResults=true;
  const base=voText.value?voText.value.trimEnd()+" ":"";
  rec.onresult=e=>{let fin="",tmp="";for(const r of e.results){(r.isFinal?(fin+=r[0].transcript+" "):(tmp+=r[0].transcript))}
    voText.value=base+fin+tmp; voText.scrollTop=voText.scrollHeight;};
  let err="";
  rec.onerror=e=>{err=e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"||e.error==="network"?"Mic is blocked inside this preview. Use your keyboard's voice typing instead: Windows Win + H · Mac press Fn twice · Phone tap 🎤 on the keyboard.":
    e.error==="no-speech"?"Didn't hear anything. Tap the mic to try again.":"Recording stopped. Tap the mic to try again.";};
  rec.onend=()=>{setLive(false,err||"Stopped. Tap the mic to keep going, or sort your day."); if(err) voText.focus()};
  try{rec.start();setLive(true)}catch(x){setLive(false,"Mic is blocked inside this preview. Use your keyboard's voice typing instead: Windows Win + H · Mac press Fn twice · Phone tap 🎤 on the keyboard.");voText.focus()}
}
function stopRec(){rec&&rec.stop()}
function openVoice(autostart){voText.value=dumpEl.value; document.getElementById("voLang").value=document.getElementById("lang").value;
  vo.hidden=false; setLive(false); if(autostart) startRec(); else voText.focus();}

/* ---------- profile helpers ---------- */
const HOBBIES=["Music","Walk outside","Stretch / yoga","Doodle or draw","Read","Call a friend","Snack","Dance","Journal","Short game","Gardening","Make chai/coffee","Pet time","Nap (20 min)","Scroll memes (5 min)"];
const POMO={pomo:{e:"🍅",t:"Pomodoro",d:"25 min focus, 5 min break, a longer break every 4 rounds."},
  long:{e:"🌊",t:"Longer focus",d:"45–50 min focus, 10 min breaks. Good for deep work days."},
  flex:{e:"🎈",t:"No fixed timer",d:"Blocks sized to each task, breaks when it feels natural. No pressure."}};
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||"");return m?(+m[1])*60+(+m[2]):null};
const fromMin=n=>{n=((n%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")};
const fmt12=t=>{const n=toMin(t); if(n===null) return t; let h=Math.floor(n/60),m=n%60,ap=h>=12?"pm":"am"; h=h%12||12; return h+(m?":"+String(m).padStart(2,"0"):"")+" "+ap};
function startGuess(){const p=state.profile||{}, now=new Date(), cur=now.getHours()*60+now.getMinutes();
  const w=toMin(p.wake||"08:00"), sl=toMin(p.sleep||"23:30");
  let n=Math.ceil((cur+10)/15)*15; const awake=sl>w?(cur>=w&&cur<sl-60):(cur>=w||cur<sl-60);
  return awake?fromMin(n):fromMin(w+30);}
function focusRule(){const mode=(state.profile||{}).pomo||"flex";
  return `- Focus style: ${mode==="pomo"?"Pomodoro: 25 min focus, 5 min breaks, a 15-20 min break after every 4 focus blocks.":mode==="long"?"Longer blocks: 45-50 min focus, 10 min breaks.":"Flexible: size each block to the task (10-60 min), add a break only when a real pause makes sense. Do not force a fixed rhythm."}`;}
function breakRule(){const hob=((state.profile||{}).hobbies||[]).join(", ")||"none given";
  return `- Breaks (brk:true): fill each break with ONE activity the user enjoys. First use anything the user said they want to do in a break; otherwise pick from their favourites: ${hob}. Write it like "Break: walk outside". Vary them.`;}
function routineRules(hhmm){const p=state.profile||{};
  return `- routine: an ordered list of blocks for the rest of today (no clock times). They wake at ${p.wake||"08:00"} and sleep at ${p.sleep||"23:30"}. Now is ${hhmm}; the plan starts around ${startGuess()} and must fit before their sleep time. If it doesn't fit, keep only the most important blocks.
${focusRule()}
${breakRule()}
- Each non-break block sets "for" to the exact text of the urgent/important/todo item it works on (copied exactly), or null. One task may take more than one block.
- Hardest urgent task goes first. Max 12 blocks.`;}

/* ---------- routine (flow) ---------- */
const MINS=[5,10,15,20,25,30,40,45,50,60,75,90,120];
const STOP=new Set(["the","and","for","with","your","you","from","that","this","then","into","about","finish","start","quick","batch","break","task","tasks","some","more","just","before","after","today"]);
const normT=t=>String(t||"").toLowerCase().replace(/[^a-z0-9ऀ-ॿ]+/g," ").split(" ").filter(w=>w.length>2&&!STOP.has(w));
function matchTask(text){const toks=new Set(normT(text)); if(!toks.size) return null; let best=null,score=0;
  for(const k of ["urgent","important","todo"]) for(const i of (state.buckets[k]||[])){const tt=[...new Set(normT(i.text))]; if(!tt.length) continue;
    const hit=tt.filter(w=>toks.has(w)).length, sc=hit/Math.min(tt.length,toks.size); if(hit&&sc>score){score=sc;best=i.id}}
  return score>=0.5?best:null;}
function linkByText(t,b){const n=String(t||"").toLowerCase().trim(); if(!n) return null;
  for(const k of ["urgent","important","todo"]){const hit=(b[k]||[]).find(i=>i.text.toLowerCase().trim()===n); if(hit) return hit.id}
  return null;}
function slotDone(sl){if(sl.sdone) return true; if(!sl.taskId) return false; const [,t]=findItem(sl.taskId); return !!(t&&t.done)}
function ensureRoutine(){const r=state.routine||[];
  for(const sl of r){if(!sl.id) sl.id=uid(); sl.mins=+sl.mins||15;
    if(!sl.brk&&!sl.taskId&&!sl.linkTried){sl.linkTried=true; const m=matchTask(sl.task); if(m) sl.taskId=m}}
  state.routine=r.filter(sl=>{if(!sl.taskId) return true; const [k,t]=findItem(sl.taskId);
    if(!t||BUCKETS.find(x=>x.k===k).soft) return !!sl.sdone; return true});}
function nextSlot(){ensureRoutine(); return (state.routine||[]).find(sl=>!slotDone(sl))||null}
function defMins(){return (state.profile||{}).pomo==="long"?45:25}
function fmtDur(m){m=Math.round(m); const h=Math.floor(m/60), mm=m%60; return h?(h+"h"+(mm?" "+mm+"m":"")):mm+" min"}
function nowRounded(){const d=new Date(); return fromMin(Math.ceil((d.getHours()*60+d.getMinutes())/5)*5)}
function rStart(){return state.routineStart||startGuess()}

async function aiRoutine(req){
  if(rBusy) return;
  if(!sampleFn){rMsg="AI isn't available in this view. Open the page on claude.ai while signed in."; rUndo=null; renderRoutine(); return}
  ensureRoutine(); const r=state.routine||[], p=state.profile||{};
  const open=["urgent","important","todo"].flatMap(k=>(state.buckets[k]||[]).filter(i=>!i.done&&!(i.carried&&!i.decided)).map(i=>({ref:i.id,text:i.text,bucket:k})));
  const cur=r.filter(x=>!slotDone(x)).map(x=>({task:x.task,mins:+x.mins,brk:!!x.brk,ref:x.taskId||null}));
  const doneT=r.filter(slotDone).map(x=>x.task);
  const hhmm=new Date().toTimeString().slice(0,5);
  const prompt=`You are a gentle, ADHD-friendly planner. Update the user's flow (an ordered list of blocks) for the rest of today.
Now: ${hhmm}. They sleep at ${p.sleep||"23:30"}. Everything left must fit before that.
${focusRule()}
${breakRule()}
Open tasks (ref = id): ${JSON.stringify(open)}
Current flow: ${JSON.stringify(cur)}
Already done today: ${JSON.stringify(doneT)}
User's request: "${(req||"Re-plan the rest of my day from my open tasks.").replace(/"/g,"'")}"
Rules:
- Follow the request closely. If they're tired or short on time, make it lighter: drop or shrink less important blocks instead of cramming.
- Never include things already done.
- Each non-break block sets "ref" to the ref of the open task it works on, or null.
- Short block names (max 10 words). Max 12 blocks. No clock times.
Return ONLY JSON: {"routine":[{"task":str,"mins":int,"brk":bool,"ref":str|null}],"message":str}
"message" is one short, friendly line saying what you changed.`;
  rBusy=true; rMsg=""; renderRoutine();
  try{const res=await sampleFn.json(prompt,{modelTier:"default"});
    const valid=new Set(open.map(o=>o.ref));
    const nb=(Array.isArray(res.routine)?res.routine:[]).map(x=>({id:uid(),task:String(x.task||"").slice(0,140),mins:Math.max(5,Math.min(180,+x.mins||15)),brk:!!x.brk,taskId:(!x.brk&&valid.has(x.ref))?x.ref:null,linkTried:false}));
    if(!nb.length) throw new Error("empty");
    rUndo=JSON.parse(JSON.stringify(r));
    state.routine=[...r.filter(slotDone).map(x=>({...x,sdone:true})),...nb];
    state.routineStart=nowRounded();
    rMsg=String(res.message||"Updated your flow."); save();
  }catch(e){rMsg=errMsg(e); rUndo=null}finally{rBusy=false; render()}}

/* ---------- new day: carry unfinished tasks ---------- */
function carryOver(){const today=dkey(new Date());
  if(state.example){state.day=today; return}
  if(!state.day){state.day=today; bringScheduled(); bringRepeats(); return}
  if(state.day===today){const a=bringScheduled(), r=bringRepeats(); if(a||r){save()} return}
  const prev=state.day, b=state.buckets||{}; let n=0;
  state.log=state.log||{};
  const L=state.log[prev]=state.log[prev]||{done:[],carried:[],dropped:[]};
  for(const k of ["urgent","important","todo"]){(b[k]||[]).filter(i=>i.done).forEach(i=>L.done.push({t:i.text,k}))}
  for(const k of ["urgent","important","todo"]){b[k]=(b[k]||[]).filter(i=>!i.done&&!i.repId).map(i=>{n++; L.carried.push({t:i.text,k}); return {...i,carried:true,decided:false,from:i.from||prev}})}
  if((b.happy||[]).length) L.happy=(b.happy||[]).map(i=>i.text);
  b.happy=[]; b.letgo=[];
  state.buckets=b; state.routine=[]; state.routineStart=null;
  state.note=n?`${n} unfinished thing${n>1?"s":""} came with you from yesterday. You decide what happens to them.`:"";
  state.day=today; bringScheduled(); bringRepeats(); save(); if(n) setTimeout(()=>toast(`${n} task${n>1?"s":""} carried over. Decide at the top.`),600);}
function bringScheduled(){const today=dkey(new Date()); const due=(state.scheduled||[]).filter(x=>x.due<=today); if(!due.length) return 0;
  state.scheduled=(state.scheduled||[]).filter(x=>x.due>today);
  for(const x of due){const {k,due:_,...it}=x; (state.buckets[k]=state.buckets[k]||[]).unshift({...it,carried:false,decided:true,planned:true})}
  setTimeout(()=>toast(`${due.length} planned task${due.length>1?"s":""} for today added`),900); return due.length;}
function logToday(kind,entry){const d=dkey(new Date()); state.log=state.log||{}; const L=state.log[d]=state.log[d]||{done:[],carried:[],dropped:[]}; L[kind].push(entry)}
function findItem(id){for(const x of BUCKETS){const it=(state.buckets[x.k]||[]).find(i=>i.id===id); if(it) return [x.k,it]} return [null,null]}
function scheduleItem(id,date){const [k,it]=findItem(id); if(!it||!date) return;
  state.buckets[k]=state.buckets[k].filter(i=>i.id!==id);
  (state.scheduled=state.scheduled||[]).push({...it,k,due:date,decided:true,carried:false});
  openMenu=null; render(); save(); toast("Planned for "+new Date(date+"T00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"}));}
function dropItem(id){const [k,it]=findItem(id); if(!it) return; state.buckets[k]=state.buckets[k].filter(i=>i.id!==id); logToday("dropped",{t:it.text,k}); render(); save(); toast("Dropped. One less thing to carry 🍃")}

function drawTimer(){const [f,pl]=timerEls(); if(!timer){f.hidden=true; pl.hidden=true; return}

    } else {

        <button data-t="pause" aria-label="${timer.paused?"Resume":"Pause"}">${timer.paused?"▶":"❚❚"}</button><button data-t="stop" aria-label="Stop timer">■</button>`;

function timerClick(e){const b=e.target.closest("[data-t]"); if(!b||!timer) return; const t=b.dataset.t;
